services:
  yealink-fritzbox-phonebook-sync:
    # Pre-built image from GitHub Container Registry.
    # Pin to a concrete version for reproducible deployments; `latest`
    # pulls the newest release. To build from source instead, replace
    # image: with: build: .
    image: ghcr.io/otih/yealink-fritzbox-phonebook-sync:0.8.0
    restart: unless-stopped
    # Use host networking so the container can reach the Fritzbox
    # (fritz.box resolves via IPv6, which Docker bridge doesn't route).
    # The listen port is directly on the host — no port mapping needed.
    network_mode: host
    environment:
      FB_HOST: ${FB_HOST:-fritz.box}
      FB_PORT: ${FB_PORT:-49000}
      FB_USER: ${FB_USER:?FB_USER must be set in .env}
      FB_PASSWORD: ${FB_PASSWORD:?FB_PASSWORD must be set in .env}
      FB_PHONEBOOK_ID: ${FB_PHONEBOOK_ID:-}
      SYNC_LISTEN_PORT: ${SYNC_LISTEN_PORT:-8080}
      SYNC_REFRESH_INTERVAL: ${SYNC_REFRESH_INTERVAL:-3600}
      SYNC_SERVER_URL: ${SYNC_SERVER_URL:?SYNC_SERVER_URL must be set in .env}
      SYNC_AUTH_USER: ${SYNC_AUTH_USER:-}
      SYNC_AUTH_PASSWORD: ${SYNC_AUTH_PASSWORD:-}
      SYNC_LOG_LEVEL: ${SYNC_LOG_LEVEL:-INFO}
      SYNC_LOG_FORMAT: ${SYNC_LOG_FORMAT:-text}
      SYNC_ALLOWED_IPS: ${SYNC_ALLOWED_IPS:-}
      SYNC_CACHE_DIR: ${SYNC_CACHE_DIR:-}
      SYNC_DEDUP_CONTACTS: ${SYNC_DEDUP_CONTACTS:-}
    # Read-only root filesystem for defense in depth.
    # The app needs no writable paths — all state is in-memory.
    # Exception: set SYNC_CACHE_DIR and mount a volume for the optional
    # persistent phonebook cache (see volumes below).
    read_only: true
    tmpfs:
      - /tmp
    # Optional: persistent phonebook cache (bridges restarts while the
    # Fritzbox is unreachable). Uncomment and set SYNC_CACHE_DIR=/data
    # in your .env to enable.
    # volumes:
    #   - ./phonebook-cache:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # If the Fritzbox is on a different network/host reachable via the
    # host's network stack, use network_mode: host instead of ports:
    #
    # network_mode: host
