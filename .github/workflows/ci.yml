name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check yealink-fritzbox-phonebook-sync.py tests/

      - name: Check formatting
        run: ruff format --check yealink-fritzbox-phonebook-sync.py tests/

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest tests/ -v

  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve base image digest
        # Pin the exact base-image build the image is based on; recorded as
        # an OCI label (org.opencontainers.image.base.digest) via build-arg.
        id: base
        run: |
          DIGEST=$(docker manifest inspect python:3.15-alpine | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['manifests'][0]['digest'])")
          echo "digest=sha256:$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Base image digest: sha256:$DIGEST"

      - name: Build image (no push yet — scan first)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true  # load into local daemon for scanning
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (workflow artifact)
        # Software Bill of Materials as a downloadable workflow artifact
        # for quick human audits. The authoritative copy is attached to the
        # image itself as an OCI attestation in the push step below.
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: cyclonedx-json
          artifact-name: sbom.cdx.json

      - name: Vulnerability scan (gate)
        # Fails the build on CRITICAL/HIGH CVEs before anything is published.
        # trivy-action pinned to commit SHA (supply-chain protection).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Push with SBOM attestation (only if scan passed)
        # buildx reuses the cached layers (nothing rebuilds) and pushes the
        # image with the CycloneDX SBOM attached as an OCI artifact
        # (referrer manifest) in the registry — retrievable by anyone with
        # standard tooling (docker buildx imagetools, oras, Trivy).
        # provenance records the build inputs (SLSA), the standard
        # companion attestation.
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
