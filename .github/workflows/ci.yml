name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint & types (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install ruff + mypy
        run: pip install ruff mypy

      - name: Lint
        run: ruff check yealink-fritzbox-phonebook-sync.py tests/

      - name: Check formatting
        run: ruff format --check yealink-fritzbox-phonebook-sync.py tests/

      - name: Type-check
        run: mypy yealink-fritzbox-phonebook-sync.py

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest + coverage
        run: pip install pytest pytest-cov

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=yealink_fritzbox_phonebook_sync --cov-report=term --cov-fail-under=45

  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve base image digest
        # Pin the exact base-image build the image is based on; recorded as
        # an OCI label (org.opencontainers.image.base.digest) via build-arg.
        id: base
        run: |
          DIGEST=$(docker manifest inspect python:3.15-alpine | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['manifests'][0]['digest'])")
          echo "digest=sha256:$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Base image digest: sha256:$DIGEST"

      - name: Build image (no push yet — scan first)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true  # load into local daemon for scanning
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (workflow artifact)
        # Software Bill of Materials as a downloadable workflow artifact
        # for quick human audits. The authoritative copy is attached to the
        # image itself as an OCI attestation in the push step below.
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: cyclonedx-json
          artifact-name: sbom.cdx.json

      - name: Vulnerability scan (gate)
        # Fails the build on CRITICAL/HIGH CVEs before anything is published.
        # trivy-action pinned to commit SHA (supply-chain protection).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Push with SBOM attestation (only if scan passed)
        # buildx reuses the cached layers (nothing rebuilds) and pushes the
        # image with the CycloneDX SBOM attached as an OCI artifact
        # (referrer manifest) in the registry — retrievable by anyone with
        # standard tooling (docker buildx imagetools, oras, Trivy).
        # provenance records the build inputs (SLSA), the standard
        # companion attestation.
        # Multi-arch: linux/amd64 + linux/arm64 (Raspberry Pi / ARM hosts).
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

  e2e:
    name: E2E smoke test (container start)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t yfps-e2e:local .

      - name: Start container without Fritzbox credentials (must boot)
        # The server must start and serve /health even when the Fritzbox
        # is unreachable — that is its designed failure mode (placeholder
        # menu, background retries). Proves Dockerfile + entrypoint + app
        # wiring works end-to-end. Auth is enabled to test the productive
        # configuration end-to-end.
        run: |
          docker run -d --rm \
            -e FB_HOST=192.0.2.1 \
            -e FB_USER=dummy \
            -e FB_PASSWORD=dummy \
            -e SYNC_SERVER_URL=http://127.0.0.1:8080 \
            -e SYNC_AUTH_USER=e2euser \
            -e SYNC_AUTH_PASSWORD=e2epass \
            -p 18080:8080 \
            --name yfps-e2e \
            yfps-e2e:local

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/health > /dev/null 2>&1; then
              echo "Health check OK after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health did not respond within 30s"
          docker logs yfps-e2e
          exit 1

      - name: /metrics must serve Prometheus format
        run: curl -sf http://127.0.0.1:18080/metrics | grep -q 'yfps_sync_'

      - name: Auth must reject unauthenticated /menu.xml (401)
        # Auth is enabled in this container (SYNC_AUTH_USER set) — an
        # unauthenticated request must get 401, and correct credentials
        # must get 200 with the placeholder menu.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/menu.xml)
          if [ "$code" != "401" ]; then
            echo "::error::/menu.xml not protected by auth (HTTP $code, expected 401)"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -u e2euser:e2epass http://127.0.0.1:18080/menu.xml)
          if [ "$code" != "200" ]; then
            echo "::error::/menu.xml rejected correct credentials (HTTP $code)"
            exit 1
          fi
          echo "Auth enforced: unauthenticated 401, authenticated 200"

      - name: SIGTERM must stop the container quickly
        run: |
          timeout 10 docker stop yfps-e2e
          echo "Graceful stop OK"
