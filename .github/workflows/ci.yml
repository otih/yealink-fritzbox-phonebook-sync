name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  # Manual "rebuild & publish now" — runs the full pipeline on main.
  workflow_dispatch:
  # Called by the weekly rebuild workflow when the base image drifted:
  # runs the full pipeline (tests, E2E, CVE gate) and publishes fresh
  # :main/:latest images — no commit to main needed (PR-only mode).
  workflow_call:

# Serialize runs per ref and event: rapid successive merges to main
# previously raced their registry pushes — a superseded run finishing
# last overwrote :latest with an OLDER build (observed 2026-10-25).
# cancel-in-progress drops superseded runs before they publish; tag
# pushes are unique refs, so releases never cancel each other, and
# workflow_call runs (rebuild) are isolated from push runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint & types (ruff + mypy)
    runs-on: ubuntu-latest
    permissions: {}  # lint needs no token scopes
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install ruff + mypy
        run: pip install ruff mypy

      - name: Lint
        run: ruff check yealink-fritzbox-phonebook-sync.py tests/

      - name: Check formatting
        run: ruff format --check yealink-fritzbox-phonebook-sync.py tests/

      - name: Type-check
        run: mypy yealink-fritzbox-phonebook-sync.py

      - name: Image-pin gate (no :latest in shipped manifests)
        # docker-compose.yml and k8s.yaml must pin a concrete release
        # version — :latest in a manifest means "whatever CI published
        # last", which is exactly what reproducible deploys avoid.
        run: |
          if grep -n 'yealink-fritzbox-phonebook-sync:latest' docker-compose.yml k8s.yaml; then
            echo "::error::Pinned manifests must not reference :latest — pin the release version."
            exit 1
          fi

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions: {}  # tests need no token scopes
    strategy:
      matrix:
        python-version: ['3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest + coverage
        run: pip install pytest pytest-cov

      - name: Run tests with coverage
        # Gate ratchets upward as coverage grows: 45% was the honest
        # starting point (2026), the suite reached 62% with the negative
        # tests (v0.10.1) — gate raised to 60% so it can only go up.
        run: pytest tests/ -v --cov=yealink_fritzbox_phonebook_sync --cov-report=term --cov-fail-under=60

  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    # E2E is a GATE for publishing: the docker job must not push until the
    # container smoke test passed (v0.3.0 proved the hole — its E2E failed
    # on the auth check while the image still got published).
    needs: [lint, test, e2e]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # type=ref,event=branch tags pushes with the branch name:
          # main pushes keep publishing :main, dev pushes publish :dev
          # (the bleeding-edge image, full CVE gate, for test hosts).
          # :latest stays exclusive to the default branch (main) — dev
          # must never leak into a "just pull latest" deployment.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve base image digest
        # Pin the exact base-image build the image is based on; recorded as
        # an OCI label (org.opencontainers.image.base.digest) via build-arg.
        id: base
        run: |
          DIGEST=$(docker manifest inspect python:3.15-alpine | \
            python3 -c "import sys,json; d=json.load(sys.stdin)['manifests'][0]['digest']; print(d if d.startswith('sha256:') else 'sha256:'+d)")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Base image digest: $DIGEST"

      - name: Build image (no push yet — scan first)
        # Loads into the local daemon with BOTH tags so the scan steps
        # below verify THIS build, not the stale registry :latest (the
        # local :latest would otherwise shadow the registry image on
        # PR runs and after base-image drift, silently scanning old bits).
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true  # load into local daemon for scanning
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            yfps/ci:scan-target
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (workflow artifact)
        # Software Bill of Materials as a downloadable workflow artifact
        # for quick human audits. The authoritative copy is attached to
        # the image itself as an OCI attestation in the push step below.
        # upload-release-assets: false — anchore/sbom-action attaches the
        # SBOM to the GitHub Release object whenever one exists during a
        # tag run. With contents:read-only that fails with 'Resource not
        # accessible by integration' BEFORE the image push (v0.9.0: the
        # 0.9.0 image never reached the registry). The SBOM stays
        # available as workflow artifact + OCI attestation on the image.
        uses: anchore/sbom-action@v0
        with:
          image: yfps/ci:scan-target
          format: cyclonedx-json
          artifact-name: sbom.cdx.json
          upload-release-assets: false

      - name: Vulnerability scan (gate)
        # Fails the build on CRITICAL/HIGH CVEs before anything is published.
        # Scans the build from THIS run (yfps/ci:scan-target), never a stale
        # registry tag. trivy-action pinned to commit SHA (supply-chain).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: yfps/ci:scan-target
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Push with SBOM attestation (only if scan passed)
        # buildx reuses the cached layers (nothing rebuilds) and pushes the
        # image with the CycloneDX SBOM attached as an OCI artifact
        # (referrer manifest) in the registry — retrievable by anyone with
        # standard tooling (docker buildx imagetools, oras, Trivy).
        # provenance records the build inputs (SLSA), the standard
        # companion attestation.
        # Multi-arch: linux/amd64 + linux/arm64 (Raspberry Pi / ARM hosts).
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

  e2e:
    name: E2E smoke test (container start)
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions: {}  # e2e needs no token scopes
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t yfps-e2e:local .

      - name: Start container without Fritzbox credentials (must boot)
        # The server must start and serve /health even when the Fritzbox
        # is unreachable — that is its designed failure mode (placeholder
        # menu, background retries). Proves Dockerfile + entrypoint + app
        # wiring works end-to-end. Auth is enabled to test the productive
        # configuration end-to-end.
        run: |
          docker run -d --rm \
            -e FB_HOST=192.0.2.1 \
            -e FB_USER=dummy \
            -e FB_PASSWORD=dummy \
            -e SYNC_SERVER_URL=http://127.0.0.1:8080 \
            -e SYNC_AUTH_USER=e2euser \
            -e SYNC_AUTH_PASSWORD=e2epass \
            -p 18080:8080 \
            --name yfps-e2e \
            yfps-e2e:local

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/health > /dev/null 2>&1; then
              echo "Health check OK after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health did not respond within 30s"
          docker logs yfps-e2e
          exit 1

      - name: /metrics must serve Prometheus format
        run: curl -sf http://127.0.0.1:18080/metrics | grep -q 'yfps_sync_'

      - name: Auth must reject unauthenticated /menu.xml (401)
        # Auth is enabled in this container (SYNC_AUTH_USER set) — an
        # unauthenticated request must get 401, and correct credentials
        # must get 200 with the placeholder menu.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/menu.xml)
          if [ "$code" != "401" ]; then
            echo "::error::/menu.xml not protected by auth (HTTP $code, expected 401)"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -u e2euser:e2epass http://127.0.0.1:18080/menu.xml)
          if [ "$code" != "200" ]; then
            echo "::error::/menu.xml rejected correct credentials (HTTP $code)"
            exit 1
          fi
          echo "Auth enforced: unauthenticated 401, authenticated 200"

      - name: --check must fail cleanly against a dead Fritzbox
        # Diagnostic mode exit codes, exercised in the real container:
        # against the TEST-NET host it must print FAIL + hints and exit 1
        # — and never hang (the SOAP timeout applies).
        run: |
          set +e
          timeout 60 docker run --rm \
            -e FB_HOST=192.0.2.1 -e FB_USER=dummy -e FB_PASSWORD=dummy \
            --entrypoint python3 yfps-e2e:local \
            /app/yealink-fritzbox-phonebook-sync.py --check
          code=$?
          set -e
          if [ "$code" != "1" ]; then
            echo "::error::--check against a dead Fritzbox must exit 1 (got $code)"
            exit 1
          fi
          echo "--check fails cleanly with exit 1"

      - name: SYNC_CACHE_DIR restores a snapshot across restarts
        # Write a snapshot via the cache mechanism (hand-crafted, same
        # format _save_cache produces), restart the container with the
        # Fritzbox dead — the menu must come from the cache, not the
        # placeholder. Then verify a fresh container WITHOUT the cache
        # env still serves the placeholder (opt-in semantics).
        run: |
          mkdir -p /tmp/yfps-cache
          cat > /tmp/yfps-cache/phonebook-cache.json <<'JSON'
          {"menu_xml": "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<YealinkIPPhoneMenu>\n  <MenuItem>\n    <Name>E2E Cache (7)</Name>\n    <URL>http://127.0.0.1:8080/contacts/1.xml</URL>\n  </MenuItem>\n</YealinkIPPhoneMenu>\n",
           "contacts": {"1": "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<YealinkIPPhoneDirectory>\n  <DirectoryEntry>\n    <Name>Cached Entry</Name>\n    <Telephone>+4917012345678</Telephone>\n  </DirectoryEntry>\n</YealinkIPPhoneDirectory>\n"},
           "pb_meta": [{"id": 1, "name": "E2E Cache", "count": 7}],
           "last_sync": 1760000000.0, "total_contacts": 7}
          JSON
          # The container runs as the non-root 'app' user (UID 1000) —
          # the bind-mounted cache must be readable AND writable by it.
          # GitHub runners cannot chown to foreign UIDs, so world-access
          # the test dir instead; production users should prefer a named
          # volume or chown the host dir (see configuration docs).
          chmod 777 /tmp/yfps-cache
          chmod 666 /tmp/yfps-cache/phonebook-cache.json

          docker run -d --rm \
            -e FB_HOST=192.0.2.1 \
            -e FB_USER=dummy -e FB_PASSWORD=dummy \
            -e SYNC_SERVER_URL=http://127.0.0.1:8080 \
            -e SYNC_AUTH_USER=e2euser -e SYNC_AUTH_PASSWORD=e2epass \
            -e SYNC_CACHE_DIR=/data \
            -v /tmp/yfps-cache:/data \
            -p 18081:8080 \
            --name yfps-e2e-cached \
            yfps-e2e:local

          for i in $(seq 1 30); do
            if curl -sf -u e2euser:e2epass http://127.0.0.1:18081/menu.xml | grep -q 'E2E Cache (7)'; then
              echo "Cache restore OK after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::menu.xml did not serve the cached snapshot within 30s"
          docker logs yfps-e2e-cached
          exit 1

      - name: SIGTERM must stop the container quickly
        run: |
          timeout 10 docker stop yfps-e2e
          timeout 10 docker stop yfps-e2e-cached || true
          echo "Graceful stop OK"
