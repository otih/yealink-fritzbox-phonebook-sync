name: Weekly Image Rebuild

on:
  # Rebuild Mondays after the vulnerability scan (04:00 UTC) so a changed
  # base image gets picked up and published in the same cycle.
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read     # read main's HEAD (metadata only)
  packages: write    # the called CI workflow publishes fresh images to GHCR
                    # (effective GITHUB_TOKEN permissions come from THIS
                    # caller workflow — it must grant what ci.yml needs)

jobs:
  drift-check:
    name: Detect base image drift
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.drift.outputs.changed }}
      published: ${{ steps.published.outputs.digest }}
      upstream: ${{ steps.upstream.outputs.digest }}
    steps:
      # No checkout, no commits: since main is protected by a ruleset that
      # requires status checks on every ref update, bots cannot push to it.
      # The last known base-image digest is read from the OCI label
      # (org.opencontainers.image.base.digest) on the published :latest
      # image instead of a tracked file.
      - name: Read base digest from the published image
        id: published
        run: |
          set -euo pipefail
          # Pull the amd64 image (public package) and read the base-digest
          # label. buildx imagetools cannot template labels off a
          # multi-arch index; docker inspect on the pulled image can.
          docker pull --platform linux/amd64 \
            ghcr.io/otih/yealink-fritzbox-phonebook-sync:latest >/dev/null
          LABEL=$(docker inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' \
            ghcr.io/otih/yealink-fritzbox-phonebook-sync:latest)
          # Normalize: strip a redundant sha256: prefix (older published
          # images carry a double prefix — fixed in CI, normalized here).
          LABEL="sha256:${LABEL#sha256:}"
          LABEL="sha256:${LABEL#sha256:}"
          echo "digest=$LABEL" >> "$GITHUB_OUTPUT"
          echo "Published image was built on base: $LABEL"

      - name: Resolve current upstream digest
        id: upstream
        run: |
          set -euo pipefail
          CURRENT=$(docker manifest inspect python:3.15-alpine | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['manifests'][0]['digest'])")
          CURRENT="sha256:${CURRENT#sha256:}"
          echo "digest=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Upstream python:3.15-alpine is now: $CURRENT"

      - name: Detect drift
        id: drift
        run: |
          if [ "${{ steps.upstream.outputs.digest }}" = "${{ steps.published.outputs.digest }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Base image unchanged — no rebuild needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Base image drifted: ${{ steps.published.outputs.digest }} -> ${{ steps.upstream.outputs.digest }}"
          fi

  # Reuse the full CI pipeline as a called workflow: lint, tests (3
  # Python versions), E2E, CVE gate, then multi-arch publish with SBOM
  # and provenance. Same gates as a normal main push — the rebuild
  # path can never skip them. The called workflow runs on main's HEAD
  # (github.sha of this scheduled run), so no push to main is involved;
  # inside it github.event_name is 'workflow_call' (not 'pull_request'),
  # so the publish steps run as intended.
  rebuild:
    name: Rebuild and publish via CI pipeline
    needs: drift-check
    if: needs.drift-check.outputs.changed == 'true'
    # workflow_call on our own repo stays @main deliberately: a SHA would
    # freeze ci.yml's content and break the base-drift rebuild whenever
    # ci.yml evolves. The ref is internal (same repo, protected branch).
    uses: otih/yealink-fritzbox-phonebook-sync/.github/workflows/ci.yml@main

  # Version releases remain an explicit maintainer/AI-agent decision;
  # this workflow only refreshes the rolling :main/:latest images.
