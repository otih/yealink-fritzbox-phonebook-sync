version: 2
updates:
  # GitHub Actions versions (pinned by tag; digest-pinning for trivy already)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    labels:
      - dependencies
      - ci
  # Docker base image tag (python:3.15-alpine in the Dockerfile)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps):"
    labels:
      - dependencies
